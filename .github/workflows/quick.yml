name: quick

# Быстрая проверка промежуточных правок в ветках Луноботов.
#
# У ботов нет локальной сборки: компилировать на ноутбуке владельца запрещено,
# поэтому роль «go build» между итерациями играет GitHub. Гонять ради этого
# полную матрицу из build.yml — тридцать job'ов и двадцать минут на каждую
# промежуточную правку — несоразмерно: она проверяет переносимость, а между
# итерациями нужно всего лишь знать, что код собирается и тесты проходят.
#
# Этот workflow ничего не отменяет и не заменяет: build.yml по-прежнему целиком
# отрабатывает на pull_request и на push в main. Здесь только push в ветку
# lunobot/**, где PR ещё не открыт (f4#1178, замечено при работе над батчем
# lunobot/batch/f4/2: триггер до сих пор был на устаревшем префиксе codex/**,
# который LUNOBOT.md давно не использует -- см. BRANCHES.md проекта f4 в
# учётном репозитории, "префикс codex/ полностью убран из инструкции". Из-за
# этого push в ветку пачки никогда не запускал quick вообще, только
# build.yml's полную матрицу после открытия PR -- ровно то, что батчинг
# должен был избежать).
#
# Этот workflow не покрывает подмодули plugins/*/go.mod (cloudfox, ios,
# android -- каждый со своим go.mod): `go build ./...` из корня не спускается
# в отдельный модуль. Полная проверка каждого такого модуля -- отдельные
# build-*-plugin джобы в build.yml, которые всё равно гоняются только на
# pull_request/push в main, тот же тугой бюджет CI, что и остальная полная
# матрица; расширять quick на них -- отдельная задача, не эта правка.

on:
  push:
    branches:
      - 'lunobot/**'
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: quick-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build and test (linux/amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # plugins/observer's tests need a tiny wasm test fixture (f4#1563,
      # part 1), compiled from testdata/stub/observer_stub.c with wasi-sdk
      # and never checked in -- see scripts/build_observer_test_wasm.sh.
      # Cached by wasi-sdk version so this costs a download only once.
      - name: Cache wasi-sdk
        id: cache-wasi-sdk
        uses: actions/cache@v4
        with:
          path: /opt/wasi-sdk
          key: wasi-sdk-34-x86_64-linux

      - name: Install wasi-sdk
        if: steps.cache-wasi-sdk.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/wasi-sdk.tar.gz \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz
          sudo mkdir -p /opt/wasi-sdk
          sudo tar -xzf /tmp/wasi-sdk.tar.gz --strip-components=1 -C /opt/wasi-sdk

      - name: Build plugins/observer test fixture
        run: WASI_SDK_PATH=/opt/wasi-sdk ./scripts/build_observer_test_wasm.sh

      # plugins/observer's isoimg end-to-end test (f4#1563, part 2) builds a
      # real upstream Observer module -- not the from-scratch stub above --
      # with the same wasi-sdk, plus a tiny genisoimage-built ISO9660 image
      # to probe it against. See scripts/build_isoimg_test_wasm.sh,
      # scripts/build_isoimg_test_iso.sh and
      # plugins/observer/testdata/isoimg/compat/.
      - name: Install genisoimage
        run: sudo apt-get update && sudo apt-get install -y genisoimage

      - name: Build plugins/observer isoimg test fixture (wasm)
        run: WASI_SDK_PATH=/opt/wasi-sdk ./scripts/build_isoimg_test_wasm.sh

      - name: Build plugins/observer isoimg test fixture (iso)
        run: ./scripts/build_isoimg_test_iso.sh

      # Confirms isoimg_test.wasm is spec-valid wasm and reports what
      # wasm-opt -Oz would shrink it to (f4#1563, part 2 open question 2),
      # using Binaryen's own prebuilt release, never built from source here.
      - name: Cache Binaryen
        id: cache-binaryen
        uses: actions/cache@v4
        with:
          path: /opt/binaryen
          key: binaryen-133-x86_64-linux

      - name: Install Binaryen
        if: steps.cache-binaryen.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/binaryen.tar.gz \
            https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz
          sudo mkdir -p /opt/binaryen
          sudo tar -xzf /tmp/binaryen.tar.gz --strip-components=1 -C /opt/binaryen

      - name: Check isoimg wasm fixture with Binaryen
        run: BINARYEN_PATH=/opt/binaryen ./scripts/check_isoimg_wasm.sh plugins/observer/testdata/isoimg_test.wasm

      - name: Test
        run: go test ./...
