name: Build & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }}${{ matrix.libc == 'musl' && ' musl' || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows, darwin, freebsd, dragonfly, openbsd, netbsd, illumos, solaris]
        goarch: [amd64, arm64, arm]
        # One value, so this multiplies nothing -- but it makes libc an
        # *original* matrix key, and that is load-bearing. An include entry
        # only creates a new combination when it disagrees with an original
        # value; an entry that merely adds a new key is merged into the
        # matching existing cells instead. Without this line, the musl
        # include entries below would not add two cells -- they would
        # silently convert the existing linux/amd64 and linux/arm64 cells to
        # musl, and the release would ship musl binaries under the generic
        # Linux names. (The smoke test asserts the libc of every artifact, so
        # that failure mode is caught rather than published.)
        libc: [glibc]
        exclude:
          - goos: dragonfly
            goarch: arm64
          - goos: illumos
            goarch: arm64
          - goos: solaris
            goarch: arm64
          - goos: windows
            goarch: arm
          - goos: darwin
            goarch: arm
          - goos: freebsd
            goarch: arm
          - goos: dragonfly
            goarch: arm
          - goos: openbsd
            goarch: arm
          - goos: netbsd
            goarch: arm
          - goos: illumos
            goarch: arm
          - goos: solaris
            goarch: arm
        # Linux is also cross-built for the additional architectures that
        # Go supports. vtui's graphical/FFI backends are unavailable there,
        # so these cells use its ANSI-only noffi configuration.
        include:
          - { goos: linux, goarch: 386,     build_tags: noffi }
          - { goos: linux, goarch: mips,    build_tags: noffi }
          - { goos: linux, goarch: mipsle,  build_tags: noffi }
          - { goos: linux, goarch: mips64,  build_tags: noffi }
          - { goos: linux, goarch: mips64le, build_tags: noffi }
          - { goos: linux, goarch: riscv64, build_tags: noffi }
          - { goos: linux, goarch: loong64, build_tags: noffi }
          - { goos: linux, goarch: ppc64,  build_tags: noffi }
          - { goos: linux, goarch: ppc64le, build_tags: noffi }
          # musl targets (Alpine, postmarketOS, ...). The generic Linux cells
          # above are fully static, which costs them FFI: no GPU, Wayland or
          # Ebiten backend. These two cells instead link against musl's libc
          # and keep FFI, so Alpine users get the same f4 that glibc users
          # get. Built from the same sources with -tags goffi_musl; see
          # docs/MUSL.md in unxed/goffi.
          - { goos: linux, goarch: amd64, libc: musl }
          - { goos: linux, goarch: arm64, libc: musl }
    env:
      CGO_ENABLED: 0
      BUILD_TAGS: ${{ matrix.build_tags || '' }}
      LIBC: ${{ matrix.libc || '' }}
      # Artifact and archive basename. The musl cells build the same
      # GOOS/GOARCH pair as the generic Linux cells, so they need a name of
      # their own or the two would collide. Everything else keeps the exact
      # name it has always had -- the updater and the Homebrew job match on
      # these suffixes.
      ASSET: ${{ matrix.libc == 'musl' && format('f4-linux-musl-{0}', matrix.goarch) || format('f4-{0}-{1}', matrix.goos, matrix.goarch) }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: recursive # Автоматически подтягивает vtui и vtinput

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.x'
        cache-dependency-path: go.sum

    - name: Check formatting
      # The musl amd64 cell builds the same tree as the generic amd64
      # cell, so these repo-wide checks belong to one of them, not both.
      if: matrix.goos == 'linux' && matrix.goarch == 'amd64' && matrix.libc != 'musl'
      run: |
        if [ -n "$(gofmt -s -l .)" ]; then
          echo "The following files are not properly formatted:"
          gofmt -s -l .
          echo "Please run 'gofmt -s -w .' locally and commit the changes."
          exit 1
        fi

    - name: Check language file formatting
      # The musl amd64 cell builds the same tree as the generic amd64
      # cell, so these repo-wide checks belong to one of them, not both.
      if: matrix.goos == 'linux' && matrix.goarch == 'amd64' && matrix.libc != 'musl'
      run: go run ./tools/langfmt -check cmd/f4/lang/*.lng

    - name: Verify generated application icons
      # The musl amd64 cell builds the same tree as the generic amd64
      # cell, so these repo-wide checks belong to one of them, not both.
      if: matrix.goos == 'linux' && matrix.goarch == 'amd64' && matrix.libc != 'musl'
      run: |
        go generate ./cmd/f4
        git diff --exit-code -- \
          cmd/f4/assets/icon/generated \
          cmd/f4/rsrc_windows_amd64.syso \
          cmd/f4/rsrc_windows_arm64.syso

    - name: Build binaries
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
      run: |
        mkdir -p build/plugins/dummy_internal
        EXT=""
        if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi

        # Truly static binaries on Linux.
        #
        # -extldflags '-static' used to live here and never did anything: it is
        # forwarded to the external linker, and a CGO_ENABLED=0 build never
        # invokes one. What actually made these binaries dynamic was goffi's
        # //go:cgo_import_dynamic directives -- dlopen from libdl.so.2,
        # __errno_location from libc.so.6, fakecgo's pthread_* from
        # libpthread.so.0 -- which make the Go linker emit PT_INTERP and
        # DT_NEEDED whatever the flags say.
        #
        # Our goffi fork drops those directives under the goffi_static tag, so
        # the linker has nothing left to import. FFI goes with them: the GPU,
        # Wayland and Ebiten backends are unavailable in these builds and vtui
        # falls back to its pure-Go X11 and ANSI paths. See unxed/f4#693 and
        # docs/STATIC_BUILDS.md in unxed/goffi.
        #
        # The musl cells make the opposite trade. A static binary runs on
        # Alpine but without FFI; goffi_musl instead points the same
        # directives at musl's single libc object and bakes the musl loader
        # path into PT_INTERP, so those artifacts are dynamic on purpose and
        # keep every backend. See docs/MUSL.md in unxed/goffi.
        LDFLAGS="-s -w"
        if [ "$GOOS" = "linux" ]; then
          if [ "$LIBC" = "musl" ]; then
            BUILD_TAGS="${BUILD_TAGS:+$BUILD_TAGS,}goffi_musl"
          else
            BUILD_TAGS="${BUILD_TAGS:+$BUILD_TAGS,}goffi_static"
          fi
        fi

        # Go embeds the commit in release artifacts, but not the tag. Keep
        # prerelease tags such as v0.2.0-beta available to the updater.
        APP_LDFLAGS="$LDFLAGS"
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          APP_LDFLAGS="$APP_LDFLAGS -X main.buildVersion=$GITHUB_REF_NAME"
        fi

        GCFLAGS=""
        if [ "$GOOS" = "freebsd" ]; then
          GCFLAGS="-gcflags=github.com/go-webgpu/goffi/internal/fakecgo=-std"
        fi
        # goffi bakes the musl loader path in with //go:cgo_dynamic_linker,
        # which the compiler allows only in cgo-generated code. Same
        # mechanism as the FreeBSD shim above, different package. Dropping
        # the flag is a compile error naming the directive, not a silently
        # mislinked binary.
        if [ "$LIBC" = "musl" ]; then
          GCFLAGS="-gcflags=github.com/go-webgpu/goffi/internal/dl=-std"
        fi

        BUILD_TAG_ARGS=()
        if [ -n "$BUILD_TAGS" ]; then
          BUILD_TAG_ARGS=(-tags "$BUILD_TAGS")
        fi

        # Build core
        go build "${BUILD_TAG_ARGS[@]}" -trimpath $GCFLAGS -ldflags="$APP_LDFLAGS" -o build/f4$EXT ./cmd/f4

        # Build GUI-only binary for Windows (no console flash)
        if [ "$GOOS" = "windows" ]; then
          go build "${BUILD_TAG_ARGS[@]}" -trimpath $GCFLAGS -ldflags="$APP_LDFLAGS -H windowsgui" -o build/f4-gui$EXT ./cmd/f4
        fi

        # Copy language and help assets
        cp -r cmd/f4/lang cmd/f4/help build/
        mkdir -p build/licenses
        cp plugins/visren/LICENSE.upstream build/licenses/VisRen-BSD-3-Clause.txt
        cp plugins/ios/LICENSE.go-ios build/licenses/go-ios-MIT.txt

        # Add freedesktop launch metadata and the application icon to Linux archives.
        if [ "$GOOS" = "linux" ]; then
          mkdir -p build/share/applications
          cp packaging/linux/f4.desktop build/share/applications/
          for size in 16 24 28 30 32 36 42 48 56 64 128 256 512 1024; do
            icon_dir="build/share/icons/hicolor/${size}x${size}/apps"
            mkdir -p "$icon_dir"
            cp "cmd/f4/assets/icon/generated/f4-${size}.png" \
              "$icon_dir/io.github.unxed.f4.png"
          done
          mkdir -p build/share/icons/hicolor/scalable/apps
          cp cmd/f4/assets/icon/f4.svg \
            build/share/icons/hicolor/scalable/apps/io.github.unxed.f4.svg
        fi

        # Build internal dummy plugin
        cd plugins/dummy_internal
        go build "${BUILD_TAG_ARGS[@]}" -trimpath $GCFLAGS -ldflags="$LDFLAGS" -o ../../build/plugins/dummy_internal/f4-internal-dummy-plugin$EXT .

    # A cross-built binary nobody ever started is not evidence of anything,
    # and the release publishes it all the same. Every Linux binary is now
    # static, so qemu-user runs them with no rootfs and no binfmt setup, and
    # Go runs every package's init() before main -- so a single --version
    # call is enough to catch a broken toolchain or an architecture a
    # dependency cannot actually handle. --version returns before any
    # terminal setup, so no tty is needed.
    - name: Smoke test the binary
      if: matrix.goos == 'linux'
      env:
        GOARCH_CELL: ${{ matrix.goarch }}
      run: |
        set -euo pipefail

        # Alpine userland used to execute the musl artifacts, pinned by
        # digest so a rebuilt upstream image cannot change what this proves.
        ALPINE_VERSION=3.24.1
        ALPINE_BRANCH=v3.24

        # GOARCH and qemu-user spell five of these differently.
        case "$GOARCH_CELL" in
          amd64)    QEMU=x86_64 ;;
          386)      QEMU=i386 ;;
          arm64)    QEMU=aarch64 ;;
          mipsle)   QEMU=mipsel ;;
          mips64le) QEMU=mips64el ;;
          loong64)  QEMU=loongarch64 ;;
          *)        QEMU="$GOARCH_CELL" ;;
        esac

        if [ "$LIBC" = "musl" ]; then
          # These artifacts are dynamic on purpose -- that is what keeps FFI
          # alive on Alpine -- so the static assertion below would be exactly
          # backwards here. Assert instead the two properties that decide
          # whether the binary can start on a musl system at all, both of
          # which are baked in at link time and neither of which any later
          # step could repair.
          case "$GOARCH_CELL" in
            amd64) MUSL_ARCH=x86_64 ;;
            arm64) MUSL_ARCH=aarch64 ;;
            *) echo "::error::no musl mapping for $GOARCH_CELL"; exit 1 ;;
          esac

          interp=$(readelf -lW build/f4 | sed -n 's/.*Requesting program interpreter: \(.*\)\]/\1/p')
          if [ "$interp" != "/lib/ld-musl-${MUSL_ARCH}.so.1" ]; then
            echo "::error::interpreter is '$interp', expected /lib/ld-musl-${MUSL_ARCH}.so.1 -- the goffi_musl tag did not take effect"
            exit 1
          fi

          # Exactly one DT_NEEDED, and it is musl's. A stray glibc SONAME
          # from any dependency would make the binary unstartable on Alpine
          # while still running fine here on the runner's own glibc.
          needed=$(readelf -dW build/f4 | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p')
          if [ "$needed" != "libc.musl-${MUSL_ARCH}.so.1" ]; then
            echo "::error::DT_NEEDED is '$needed', expected exactly libc.musl-${MUSL_ARCH}.so.1"
            exit 1
          fi

          # Now actually start it, against a real musl libc. qemu-user
          # resolves PT_INTERP inside the sysroot given with -L, so one
          # mechanism covers both architectures and needs no root, no
          # binfmt registration and no container.
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static
          base="https://dl-cdn.alpinelinux.org/alpine/${ALPINE_BRANCH}/releases/${MUSL_ARCH}"
          tarball="alpine-minirootfs-${ALPINE_VERSION}-${MUSL_ARCH}.tar.gz"
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o "$tarball" "$base/$tarball"
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o "$tarball.sha256" "$base/$tarball.sha256"
          sha256sum -c "$tarball.sha256"
          mkdir -p alpine-rootfs
          tar xzf "$tarball" -C alpine-rootfs
          "qemu-$QEMU-static" -L alpine-rootfs build/f4 --version

          # A musl-tagged test binary cannot run on the runner, so the one
          # assertion that only holds in this flavor rides along here: that
          # the binary knows it is a musl build, and so asks the updater for
          # the musl release asset rather than quietly replacing itself with
          # the static one. The rootfs and qemu are already in place.
          # Rebuilt here rather than carried over: each step is its own
          # shell, so the Build step's variables are gone by now -- GOARCH
          # included. Without it the test binary is built for the runner's
          # own amd64, and the arm64 cell hands qemu-aarch64 an x86_64 ELF.
          GOOS=linux GOARCH="$GOARCH_CELL" go test -c -tags "${BUILD_TAGS:+$BUILD_TAGS,}goffi_musl" \
            -gcflags=github.com/go-webgpu/goffi/internal/dl=-std \
            -o /tmp/f4-libc.test ./cmd/f4
          "qemu-$QEMU-static" -L alpine-rootfs /tmp/f4-libc.test \
            -test.run 'TestBuildLibcIsMusl|TestUpdateAssetSuffixes' -test.v
          exit 0
        fi

        # The claim the release makes about these artifacts, checked rather
        # than assumed. A binary that grew an interpreter back would still run
        # here on the runner's own glibc and would fail only later, on Alpine
        # or in a scratch container, where nobody is watching.
        if file build/f4 | grep -q 'dynamically linked'; then
          echo "::error::build/f4 is dynamically linked; the goffi_static tag did not take effect"
          file build/f4
          exit 1
        fi

        if [ "$GOARCH_CELL" = "amd64" ]; then
          ./build/f4 --version
          exit 0
        fi

        # Static, so qemu-user needs no target sysroot: no -L, no libc6-*-cross.
        sudo apt-get update -qq
        sudo apt-get install -y -qq qemu-user-static
        "qemu-$QEMU-static" build/f4 --version

    - name: Package
      run: |
        if [ "${{ matrix.goos }}" = "windows" ]; then
          (cd build && zip -r "../$ASSET.zip" .)
        else
          # Создаем архив в корне, упаковывая содержимое build (без самой папки build)
          tar -czvf "$ASSET.tar.gz" -C build .
        fi

        if [ "${{ matrix.goos }}" = "darwin" ]; then
          VERSION="0.0.${GITHUB_RUN_NUMBER}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          APP="F4.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp build/f4 "$APP/Contents/MacOS/f4"
          chmod +x "$APP/Contents/MacOS/f4"
          cp cmd/f4/assets/icon/generated/f4.icns "$APP/Contents/Resources/f4.icns"
          sed -e "s/__VERSION__/$VERSION/g" \
              -e "s/__BUILD_VERSION__/$GITHUB_RUN_NUMBER/g" \
              packaging/macos/Info.plist > "$APP/Contents/Info.plist"
          zip -r "$ASSET.app.zip" "$APP"
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.ASSET }}
        path: ${{ env.ASSET }}.*
        retention-days: 7

  # Эта джоба собирает Windows-бинарник тулчейном thongtech/go-legacy-win7,
  # чтобы f4 можно было запускать на Windows 7/8/8.1 (см. issue #514).
  #
  # Тулчейн go-legacy-win7-1.26.3-1 в остальном полноценен, но в его
  # sync/atomic отсутствуют методы Or/And у типизированных атомиков
  # (добавлены в Go 1.23, см. https://go.dev/issue/61395) — это баг
  # именно сборки тулчейна, а не самого Go 1.26.3
  # (см. https://github.com/thongtech/go-legacy-win7/issues/13, ещё не
  # исправлено апстримом). Без них не собираются github.com/gogpu/gg и
  # github.com/ncruces/go-sqlite3. Вместо патчинга каждой такой
  # зависимости по отдельности (как это было проверено вручную в
  # issue #514) добавляем недостающие методы один раз прямо в GOROOT
  # скачанного тулчейна — это эквивалентно апстримному фиксу и не требует
  # правок go.mod. Если thongtech поправят это в своей сборке, наш файл
  # с большой вероятностью начнёт конфликтовать (duplicate method) —
  # тогда этот шаг нужно будет просто удалить.
  build-win7:
    name: Build (windows7/amd64, legacy toolchain)
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
      GOOS: windows
      GOARCH: amd64

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Download go-legacy-win7 toolchain
      run: |
        set -euo pipefail
        curl -fL --retry 5 --retry-delay 10 --retry-all-errors \
          -o go-legacy-win7.tar.gz \
          https://github.com/thongtech/go-legacy-win7/releases/download/v1.26.3-1/go-legacy-win7-1.26.3-1.linux_amd64.tar.gz
        echo "8a1acb588fa3ab7827ce7b1be5795b356be65a500c70af297ad94ab2b3370ea6  go-legacy-win7.tar.gz" | sha256sum -c -
        mkdir -p "$HOME/go-legacy-win7"
        tar -xzf go-legacy-win7.tar.gz -C "$HOME/go-legacy-win7"
        echo "GOROOT=$HOME/go-legacy-win7/go-legacy-win7" >> "$GITHUB_ENV"
        echo "$HOME/go-legacy-win7/go-legacy-win7/bin" >> "$GITHUB_PATH"

    - name: Restore missing sync/atomic Or/And methods (thongtech/go-legacy-win7#13)
      run: |
        cat > "$GOROOT/src/sync/atomic/or_and_win7compat.go" <<'EOF'
        // This file restores the Or/And methods on typed atomics (added
        // upstream in Go 1.23, see https://go.dev/issue/61395) that are
        // missing from the go-legacy-win7-1.26.3-1 toolchain despite it
        // being based on Go 1.26.3. See
        // https://github.com/thongtech/go-legacy-win7/issues/13.
        // Remove this file once that's fixed upstream.
        package atomic

        func (x *Int32) Or(mask int32) (old int32) {
        	for {
        		old = x.Load()
        		if x.CompareAndSwap(old, old|mask) {
        			return old
        		}
        	}
        }

        func (x *Int32) And(mask int32) (old int32) {
        	for {
        		old = x.Load()
        		if x.CompareAndSwap(old, old&mask) {
        			return old
        		}
        	}
        }

        func (x *Int64) Or(mask int64) (old int64) {
        	for {
        		old = x.Load()
        		if x.CompareAndSwap(old, old|mask) {
        			return old
        		}
        	}
        }

        func (x *Int64) And(mask int64) (old int64) {
        	for {
        		old = x.Load()
        		if x.CompareAndSwap(old, old&mask) {
        			return old
        		}
        	}
        }

        func (x *Uint32) Or(mask uint32) (old uint32) {
        	for {
        		old = x.Load()
        		if x.CompareAndSwap(old, old|mask) {
        			return old
        		}
        	}
        }

        func (x *Uint32) And(mask uint32) (old uint32) {
        	for {
        		old = x.Load()
        		if x.CompareAndSwap(old, old&mask) {
        			return old
        		}
        	}
        }

        func (x *Uint64) Or(mask uint64) (old uint64) {
        	for {
        		old = x.Load()
        		if x.CompareAndSwap(old, old|mask) {
        			return old
        		}
        	}
        }

        func (x *Uint64) And(mask uint64) (old uint64) {
        	for {
        		old = x.Load()
        		if x.CompareAndSwap(old, old&mask) {
        			return old
        		}
        	}
        }

        func (x *Uintptr) Or(mask uintptr) (old uintptr) {
        	for {
        		old = x.Load()
        		if x.CompareAndSwap(old, old|mask) {
        			return old
        		}
        	}
        }

        func (x *Uintptr) And(mask uintptr) (old uintptr) {
        	for {
        		old = x.Load()
        		if x.CompareAndSwap(old, old&mask) {
        			return old
        		}
        	}
        }
        EOF

    - name: Build binaries
      run: |
        mkdir -p build/plugins/dummy_internal
        LDFLAGS="-s -w"
        APP_LDFLAGS="$LDFLAGS"
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          APP_LDFLAGS="$APP_LDFLAGS -X main.buildVersion=$GITHUB_REF_NAME"
        fi

        go build -trimpath -ldflags="$APP_LDFLAGS" -o build/f4.exe ./cmd/f4
        # GUI-only binary (no console flash), same as in the main matrix.
        go build -trimpath -ldflags="$APP_LDFLAGS -H windowsgui" -o build/f4-gui.exe ./cmd/f4

        cp -r cmd/f4/lang cmd/f4/help build/
        mkdir -p build/licenses
        cp plugins/visren/LICENSE.upstream build/licenses/VisRen-BSD-3-Clause.txt
        cp plugins/ios/LICENSE.go-ios build/licenses/go-ios-MIT.txt

        cd plugins/dummy_internal
        go build -trimpath -ldflags="$LDFLAGS" -o ../../build/plugins/dummy_internal/f4-internal-dummy-plugin.exe .

    - name: Package
      run: (cd build && zip -r ../f4-windows7-amd64.zip .)

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: f4-windows7-amd64
        path: f4-windows7-amd64.zip
        retention-days: 7

  # go vet in the quality job below only ever sees the linux build of the tree,
  # which leaves the 44 windows-only and 8 darwin-only files here unexamined by
  # any of its analyzers — printf, copylocks, lostcancel, loopclosure and two
  # dozen more. The build matrix already covers nine GOOS values, so vet them.
  #
  # A matrix rather than a loop in one job: a cross-GOOS vet has to build every
  # dependency for that target from scratch, so each cell costs about as much as
  # a build (~75s) and running them in sequence would add ten minutes to the
  # quality job. fail-fast is off so one broken platform does not hide the rest.
  #
  # One cell per GOOS, plus one 32-bit cell. Only winepath_{windows,other}.go are
  # selected by GOARCH, and windows/amd64 and any non-windows target between them
  # cover both sides, so a second 64-bit arch would vet identical files. Word
  # size is the exception: the shift analyzer sizes types through the target's
  # TypesSizes, so a shift that is fine against a 64-bit int is a finding against
  # a 32-bit one. linux/arm is the matrix's 32-bit cell that builds without the
  # noffi tag. linux/amd64 is absent because the quality job vets it with the
  # full analyzer set.
  #
  # unsafeptr is the one analyzer that cannot come along. Every one of these
  # platforms converts a uintptr handed back by a syscall wrapper into a pointer
  # — the view MapViewOfFile mapped, strings Wine allocated on the process heap,
  # a pseudoconsole HANDLE, a buffer owned by an NSString — and the analyzer
  # cannot tell foreign memory from Go's. Those wrappers return uintptr by
  # signature, and vet accepts a uintptr-to-pointer conversion only for reflect
  # headers, reflect.Value.Pointer and pointer arithmetic, so moving the
  # conversion elsewhere only moves the diagnostic. The linux run keeps the full
  # set, unsafeptr included, so a genuine round trip in portable code still
  # fails the build.
  vet:
    name: Vet (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: windows/amd64 }
          # Linux release builds carry goffi_static, so vet the files the build
          # actually compiles -- the stubs, not the dlopen wrappers.
          - { target: linux/arm, tags: goffi_static }
          # ...and the musl cells carry goffi_musl, which compiles the real
          # dlopen wrappers instead of those stubs. Nothing else in this
          # matrix vets that code on Linux.
          - { target: linux/amd64, tags: goffi_musl, gcflags: -gcflags=github.com/go-webgpu/goffi/internal/dl=-std }
          - { target: darwin/arm64 }
          # goffi's fakecgo shim needs the same flag the build step passes.
          - { target: freebsd/amd64, gcflags: -gcflags=github.com/go-webgpu/goffi/internal/fakecgo=-std }
          - { target: openbsd/amd64 }
          - { target: netbsd/amd64 }
          - { target: dragonfly/amd64 }
          - { target: illumos/amd64 }
          - { target: solaris/amd64 }
    env:
      CGO_ENABLED: 0
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.x'
        cache-dependency-path: go.sum

    - name: Run go vet
      env:
        TARGET: ${{ matrix.target }}
        GCFLAGS: ${{ matrix.gcflags }}
        TAGS: ${{ matrix.tags }}
      run: |
        # An array, so the empty GCFLAGS of most cells contributes no argument
        # rather than an empty one.
        flags=(-unsafeptr=false)
        if [ -n "$GCFLAGS" ]; then
          flags+=("$GCFLAGS")
        fi
        if [ -n "$TAGS" ]; then
          flags+=(-tags "$TAGS")
        fi
        GOOS="${TARGET%/*}" GOARCH="${TARGET#*/}" go vet "${flags[@]}" ./...

  quality:
    name: Quality (vet and incremental lint)
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.x'
        cache-dependency-path: go.sum

    - name: Run go vet
      run: go vet ./...

    - name: Run incremental golangci-lint
      uses: golangci/golangci-lint-action@v9.3.0
      with:
        version: v2.13.1
        args: --new-from-rev=origin/main

    # The step above only reports findings on lines a pull request touched, so
    # everything the linters have to say about existing code stays invisible —
    # currently around 2450 findings. Rather than leave that permanently
    # unspoken, each linter graduates here once its backlog is actually zero,
    # and from then on it is checked across the whole tree and cannot regrow.
    # Adding a linter to this list means clearing its debt first, in the same
    # change.
    - name: Run whole-tree golangci-lint for the linters with no backlog
      uses: golangci/golangci-lint-action@v9.3.0
      with:
        version: v2.13.1
        args: --config .golangci-strict.yml

    # Unlike the linters above this one is not incremental: it reports only
    # vulnerabilities the code actually reaches, so the whole tree is in scope
    # and the finding count stays at zero rather than accumulating a backlog.
    # The tool version is pinned; the vulnerability database it consults is
    # fetched at run time, so a newly published advisory turns this red without
    # any change here — which is the point.
    # build.yml is approaching 800 lines, most of it shell embedded in run:
    # blocks that nothing checked. actionlint validates the workflow schema and
    # every expression, and hands each run: block to shellcheck — which the
    # ubuntu image already ships, so it needs no setup here. Both classes of
    # mistake it catches otherwise cost a full CI round trip to discover.
    - name: Run actionlint
      run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

    - name: Run govulncheck
      run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  # Эта джоба создает постоянные релизы при пуше тэгов v*.*.*
  test:
    name: Test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # One hosted runner per native os/arch cell, labeled to match the
        # build matrix.
        include:
          - { os: ubuntu-latest,    target: linux/amd64, cover: linux }
          - { os: ubuntu-24.04-arm, target: linux/arm64 }
          - { os: macos-latest,     target: darwin/arm64, cover: macos }
          - { os: macos-15-intel,   target: darwin/amd64 }
          - { os: windows-latest,   target: windows/amd64, cover: windows }
          - { os: windows-11-arm,   target: windows/arm64 }
    env:
      CGO_ENABLED: 0
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.x'
        cache-dependency-path: go.sum

    - name: Run Tests
      shell: bash
      env:
        # Coverage comes from one cell per OS: which files compile is gated by
        # GOOS, so the arm64 twins would report the same lines twice. -coverpkg
        # counts hits across package boundaries, without which a project that
        # keeps most of its tests in cmd/f4 reports every other package as
        # nearly untested.
        COVER: ${{ matrix.cover && '-coverpkg=./... -coverprofile=cover.out' || '' }}
      run: |
        go test $COVER -timeout 15m -skip '^TestAllDialogs_LayoutValidation$' ./...
        # Layout validation mutates shared UI registries from parallel
        # subtests. Go 1.26 schedules them aggressively enough to expose the
        # upstream race, so isolate that test in a single-threaded process.
        GOMAXPROCS=1 go test -timeout 15m -run '^TestAllDialogs_LayoutValidation$' ./cmd/f4

    - name: Upload coverage to Codecov
      if: matrix.cover
      uses: codecov/codecov-action@v7
      with:
        files: cover.out
        # Without this the uploader also sweeps the tree for anything that
        # looks like a report and picks up cmd/f4/lang/coverage_baseline.txt,
        # which counts translation keys, not statements.
        disable_search: true
        flags: ${{ matrix.cover }}
        token: ${{ secrets.CODECOV_TOKEN }}
        # Coverage is a report, not a gate: a failed upload (or a repository
        # with no token yet) must not turn the test run red.
        fail_ci_if_error: false

    - name: Dump crash reports on failure
      if: failure()
      shell: bash
      run: |
        # Look for crash logs in cache and temp roots (vtui's fallback); never fail.
        set +e
        search_roots=()
        if [ -n "${XDG_CACHE_HOME:-}" ]; then
          search_roots+=("$XDG_CACHE_HOME/vtui_app/crashes")
        fi
        if [ -n "${HOME:-}" ]; then
          search_roots+=("$HOME/.cache/vtui_app/crashes")
          search_roots+=("$HOME/Library/Caches/vtui_app/crashes")
        fi
        if [ -n "${LOCALAPPDATA:-}" ]; then
          cache_dir="$LOCALAPPDATA"
          if command -v cygpath >/dev/null 2>&1; then
            if converted_cache_dir="$(cygpath -u "$LOCALAPPDATA" 2>/dev/null)"; then
              cache_dir="$converted_cache_dir"
            fi
          fi
          search_roots+=("$cache_dir/vtui_app/crashes")
        fi
        search_roots+=("${TMPDIR:-/tmp}")
        if [ -n "${TEMP:-}" ]; then
          temp_dir="$TEMP"
          if command -v cygpath >/dev/null 2>&1; then
            if converted_temp_dir="$(cygpath -u "$TEMP" 2>/dev/null)"; then
              temp_dir="$converted_temp_dir"
            fi
          fi
          search_roots+=("$temp_dir")
        fi
        echo "Crash report search roots:"
        printf '  %s\n' "${search_roots[@]}"
        report_count=0
        for _ in {1..20}; do
          IFS= read -r -d '' report || break
          report_count=$((report_count + 1))
          echo "=== $report ==="
          cat -- "$report"
        done < <(
          for base in "${search_roots[@]}"; do
            [ -d "$base" ] || continue
            find "$base" -maxdepth 4 -name '*.log' \
              \( -path '*f4-test-config*' -o -path '*/vtui_app/crashes/*' \) -print0 2>/dev/null
          done
        )
        if [ "$report_count" -eq 0 ]; then
          echo "No crash reports found."
        elif [ "$report_count" -eq 20 ]; then
          echo "Printed 20 crash reports; stopped at the cap."
        else
          echo "Printed $report_count crash report(s)."
        fi
        exit 0

  race:
    name: Race detector
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The race detector requires cgo and the Ubuntu runner provides the
      # native compiler needed by the instrumented test binary.
      CGO_ENABLED: 1
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.x'
        cache-dependency-path: go.sum

    - name: Run race detector
      shell: bash
      run: |
        # cmd/f4 tests replace vtui's process-global FrameManager while its
        # background task pump is alive, so they need a dedicated race-safe
        # harness before they can run under -race. luaplug's tests call raw
        # FFI pointers, which Go's checkptr rejects under -race. Keep both
        # packages in the instrumented compile below and run all other
        # package tests under the detector.
        mapfile -t packages < <(go list ./... | grep -Ev '^github.com/unxed/f4/(cmd/f4|luaplug)$')
        # The bare $packages this replaced failed the step when the list came
        # out empty, because set -e sees the assignment's exit status. mapfile
        # swallows it, and go test with no arguments would quietly fall back to
        # the current directory, so check explicitly.
        if [ ${#packages[@]} -eq 0 ]; then
          echo "::error::no packages left to run under the race detector"
          exit 1
        fi
        go test -race -timeout 15m "${packages[@]}"
        go test -race -run '^$' ./cmd/f4 ./luaplug

  release:
    name: Create Official Release
    needs: [build, build-win7, test, race]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts
        merge-multiple: true
    - name: Publish Release
      uses: softprops/action-gh-release@v3
      with:
        files: artifacts/*
        generate_release_notes: true

  # Эта джоба обновляет Homebrew tap при пуше тэгов v*.*.*,
  # чтобы под macOS можно было поставить f4 одной командой:
  #   brew install <owner>/tap/f4
  homebrew:
    name: Update Homebrew Tap
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
    - name: Compute version and download macOS artifacts
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"
        BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
        for arch in amd64 arm64; do
          file="f4-darwin-${arch}.tar.gz"
          echo "Downloading $file ..."
          curl -fL --retry 5 --retry-delay 10 --retry-all-errors -o "$file" "$BASE/$file"
          sha=$(sha256sum "$file" | cut -d' ' -f1)
          echo "SHA_${arch}=$sha" >> "$GITHUB_ENV"
          echo "URL_${arch}=$BASE/$file" >> "$GITHUB_ENV"
        done

    - name: Generate formula
      run: |
        mkdir -p tap/Formula
        cat > tap/Formula/f4.rb <<EOF
        # This file is generated automatically by CI on each tagged release.
        # Do not edit by hand — changes will be overwritten.
        class F4 < Formula
          desc "# f4 — efficient and cozy file manager in go"
          homepage "https://github.com/${GITHUB_REPOSITORY}"
          version "${VERSION}"
          license "BSD-3-Clause"

          on_macos do
            on_arm do
              url "${URL_arm64}"
              sha256 "${SHA_arm64}"
            end
            on_intel do
              url "${URL_amd64}"
              sha256 "${SHA_amd64}"
            end
          end

          def install
            bin.install "f4"
            prefix.install "plugins" if File.directory?("plugins")
          end

          test do
            assert_match "f4", shell_output("#{bin}/f4 --version 2>&1")
          end
        end
        EOF
        echo "----- Generated Formula -----"
        cat tap/Formula/f4.rb

    - name: Push formula to tap repository
      env:
        TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      run: |
        if [ -z "$TAP_TOKEN" ]; then
          echo "::warning::HOMEBREW_TAP_TOKEN secret is not set; skipping tap update."
          echo "Create a PAT with 'contents:write' on ${GITHUB_REPOSITORY_OWNER}/homebrew-tap and add it as HOMEBREW_TAP_TOKEN."
          exit 0
        fi
        TAP_REPO="${GITHUB_REPOSITORY_OWNER}/homebrew-tap"
        git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" tap-repo
        mkdir -p tap-repo/Formula
        cp tap/Formula/f4.rb tap-repo/Formula/f4.rb
        cd tap-repo
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        if git diff --quiet -- Formula/f4.rb; then
          echo "Formula already up to date; nothing to commit."
          exit 0
        fi
        git add Formula/f4.rb
        git commit -m "f4 ${VERSION}"
        git push

  # Эта джоба обновляет "плавающий" nightly релиз при каждом пуше в main
  nightly:
    name: Update Nightly Release
    needs: [build, build-win7, test, race]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
    - name: Checkout code (to get git info)
      uses: actions/checkout@v7

    - name: Set Release Metadata
      run: |
        echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
        echo "BUILD_TIME=$(date +'%Y-%m-%d %H:%M:%S')" >> "$GITHUB_ENV"

    - name: Download all artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts
        merge-multiple: true

    - name: Update Nightly Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: nightly
        name: "Continuous Build (Nightly)"
        body: |
          Automated pre-release build of the latest `main` branch.

          **Commit:** `${{ env.SHORT_SHA }}`
          **Built on:** `${{ env.BUILD_TIME }}`
        prerelease: true
        files: artifacts/*
