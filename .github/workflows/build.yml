name: Build & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows, darwin, freebsd, dragonfly, openbsd, netbsd, illumos, solaris]
        goarch: [amd64, arm64, arm]
        exclude:
          - goos: dragonfly
            goarch: arm64
          - goos: illumos
            goarch: arm64
          - goos: solaris
            goarch: arm64
          - goos: windows
            goarch: arm
          - goos: darwin
            goarch: arm
          - goos: freebsd
            goarch: arm
          - goos: dragonfly
            goarch: arm
          - goos: openbsd
            goarch: arm
          - goos: netbsd
            goarch: arm
          - goos: illumos
            goarch: arm
          - goos: solaris
            goarch: arm
    env:
      CGO_ENABLED: 0

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive # Автоматически подтягивает vtui и vtinput

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.x'
        cache-dependency-path: go.sum

    - name: Check formatting
      if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
      run: |
        if [ -n "$(gofmt -s -l .)" ]; then
          echo "The following files are not properly formatted:"
          gofmt -s -l .
          echo "Please run 'gofmt -s -w .' locally and commit the changes."
          exit 1
        fi

    - name: Verify generated application icons
      if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
      run: |
        go generate
        git diff --exit-code -- \
          assets/icon/generated \
          rsrc_windows_amd64.syso \
          rsrc_windows_arm64.syso

    - name: Run Tests
      if: matrix.goos == 'linux' && matrix.goarch == 'amd64' || (matrix.goos == 'windows' && matrix.goarch == 'amd64')
      run: |
        echo "Running f4 core tests..."
        go test -v -skip '^TestAllDialogs_LayoutValidation$' ./...
        # Layout validation mutates shared UI registries from parallel
        # subtests. Go 1.26 schedules them aggressively enough to expose the
        # upstream race, so isolate that test in a single-threaded process.
        GOMAXPROCS=1 go test -v -run '^TestAllDialogs_LayoutValidation$' .

    - name: Build binaries
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
      run: |
        mkdir -p build/plugins/dummy_internal
        EXT=""
        if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi

        # Prepare flags for truly static binary on Linux
        LDFLAGS="-s -w"
        if [ "$GOOS" = "linux" ]; then LDFLAGS="$LDFLAGS -extldflags '-static'"; fi

        GCFLAGS=""
        if [ "$GOOS" = "freebsd" ]; then
          GCFLAGS="-gcflags=github.com/go-webgpu/goffi/internal/fakecgo=-std"
        fi

        # Build core
        go build -trimpath $GCFLAGS -ldflags="$LDFLAGS" -o build/f4$EXT .

        # Build GUI-only binary for Windows (no console flash)
        if [ "$GOOS" = "windows" ]; then
          go build -trimpath $GCFLAGS -ldflags="$LDFLAGS -H windowsgui" -o build/f4-gui$EXT .
        fi

        # Copy language and help assets
        cp -r lang help build/
        mkdir -p build/licenses
        cp plugins/visren/LICENSE.upstream build/licenses/VisRen-BSD-3-Clause.txt
        cp plugins/ios/LICENSE.go-ios build/licenses/go-ios-MIT.txt

        # Add freedesktop launch metadata and the application icon to Linux archives.
        if [ "$GOOS" = "linux" ]; then
          mkdir -p build/share/applications
          cp packaging/linux/f4.desktop build/share/applications/
          for size in 16 24 28 30 32 36 42 48 56 64 128 256 512 1024; do
            icon_dir="build/share/icons/hicolor/${size}x${size}/apps"
            mkdir -p "$icon_dir"
            cp "assets/icon/generated/f4-${size}.png" \
              "$icon_dir/io.github.unxed.f4.png"
          done
          mkdir -p build/share/icons/hicolor/scalable/apps
          cp assets/icon/f4.svg \
            build/share/icons/hicolor/scalable/apps/io.github.unxed.f4.svg
        fi

        # Build internal dummy plugin
        cd plugins/dummy_internal
        go build -trimpath $GCFLAGS -ldflags="$LDFLAGS" -o ../../build/plugins/dummy_internal/f4-internal-dummy-plugin$EXT .

    - name: Package
      run: |
        if [ "${{ matrix.goos }}" = "windows" ]; then
          (cd build && zip -r ../f4-${{ matrix.goos }}-${{ matrix.goarch }}.zip .)
        else
          # Создаем архив в корне, упаковывая содержимое build (без самой папки build)
          tar -czvf f4-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz -C build .
        fi

        if [ "${{ matrix.goos }}" = "darwin" ]; then
          VERSION="0.0.${GITHUB_RUN_NUMBER}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          APP="F4.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp build/f4 "$APP/Contents/MacOS/f4"
          chmod +x "$APP/Contents/MacOS/f4"
          cp assets/icon/generated/f4.icns "$APP/Contents/Resources/f4.icns"
          sed -e "s/__VERSION__/$VERSION/g" \
              -e "s/__BUILD_VERSION__/$GITHUB_RUN_NUMBER/g" \
              packaging/macos/Info.plist > "$APP/Contents/Info.plist"
          zip -r "f4-${{ matrix.goos }}-${{ matrix.goarch }}.app.zip" "$APP"
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: f4-${{ matrix.goos }}-${{ matrix.goarch }}
        path: f4-${{ matrix.goos }}-${{ matrix.goarch }}.*
        retention-days: 7

  # Эта джоба создает постоянные релизы при пуше тэгов v*.*.*
  release:
    name: Create Official Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true
    - name: Publish Release
      uses: softprops/action-gh-release@v2
      with:
        files: artifacts/*
        generate_release_notes: true

  # Эта джоба обновляет Homebrew tap при пуше тэгов v*.*.*,
  # чтобы под macOS можно было поставить f4 одной командой:
  #   brew install <owner>/tap/f4
  homebrew:
    name: Update Homebrew Tap
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
    - name: Compute version and download macOS artifacts
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"
        BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
        for arch in amd64 arm64; do
          file="f4-darwin-${arch}.tar.gz"
          echo "Downloading $file ..."
          curl -fL --retry 5 --retry-delay 10 --retry-all-errors -o "$file" "$BASE/$file"
          sha=$(sha256sum "$file" | cut -d' ' -f1)
          echo "SHA_${arch}=$sha" >> "$GITHUB_ENV"
          echo "URL_${arch}=$BASE/$file" >> "$GITHUB_ENV"
        done

    - name: Generate formula
      run: |
        mkdir -p tap/Formula
        cat > tap/Formula/f4.rb <<EOF
        # This file is generated automatically by CI on each tagged release.
        # Do not edit by hand — changes will be overwritten.
        class F4 < Formula
          desc "# f4 — efficient and cozy file manager in go"
          homepage "https://github.com/${GITHUB_REPOSITORY}"
          version "${VERSION}"
          license "BSD-3-Clause"

          on_macos do
            on_arm do
              url "${URL_arm64}"
              sha256 "${SHA_arm64}"
            end
            on_intel do
              url "${URL_amd64}"
              sha256 "${SHA_amd64}"
            end
          end

          def install
            bin.install "f4"
            prefix.install "plugins" if File.directory?("plugins")
          end

          test do
            assert_match "f4", shell_output("#{bin}/f4 --version 2>&1")
          end
        end
        EOF
        echo "----- Generated Formula -----"
        cat tap/Formula/f4.rb

    - name: Push formula to tap repository
      env:
        TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      run: |
        if [ -z "$TAP_TOKEN" ]; then
          echo "::warning::HOMEBREW_TAP_TOKEN secret is not set; skipping tap update."
          echo "Create a PAT with 'contents:write' on ${GITHUB_REPOSITORY_OWNER}/homebrew-tap and add it as HOMEBREW_TAP_TOKEN."
          exit 0
        fi
        TAP_REPO="${GITHUB_REPOSITORY_OWNER}/homebrew-tap"
        git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" tap-repo
        mkdir -p tap-repo/Formula
        cp tap/Formula/f4.rb tap-repo/Formula/f4.rb
        cd tap-repo
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        if git diff --quiet -- Formula/f4.rb; then
          echo "Formula already up to date; nothing to commit."
          exit 0
        fi
        git add Formula/f4.rb
        git commit -m "f4 ${VERSION}"
        git push

  # Эта джоба обновляет "плавающий" nightly релиз при каждом пуше в main
  nightly:
    name: Update Nightly Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
    - name: Checkout code (to get git info)
      uses: actions/checkout@v4

    - name: Set Release Metadata
      run: |
        echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
        echo "BUILD_TIME=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true

    - name: Update Nightly Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: nightly
        name: "Continuous Build (Nightly)"
        body: |
          Automated pre-release build of the latest `main` branch.

          **Commit:** `${{ env.SHORT_SHA }}`
          **Built on:** `${{ env.BUILD_TIME }}`
        prerelease: true
        files: artifacts/*
