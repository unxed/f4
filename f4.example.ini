; f4 portable mode — the same idea as Far Manager 3's Far.exe.ini.
;
; To use it, copy this file next to the f4 binary as
;
;     f4.ini          shared by every binary in the directory
;                     (f4, f4-gui, f4.exe, f4-gui.exe), or
;     <binary>.ini    e.g. f4.exe.ini — read in preference to f4.ini
;
; and uncomment the keys you need. Without such a file (or with
; UseSystemProfiles=1) f4 keeps its profile in the per-user directory:
;
;     Windows   %APPDATA%\f4
;     Linux     ~/.config/f4   (or $XDG_CONFIG_HOME/f4)
;     macOS     ~/Library/Application Support/f4
;
; The file must be UTF-8; a byte order mark is accepted. Options → Portable
; mode inside f4 writes this file for you and can copy the current profile
; over, but the switch only takes effect after a restart: this file is read
; before the profile is located, so the mode cannot live inside the profile.

[General]

; 0 = keep everything (settings, history, macros, plugins, styles, crash
; logs) in the profile directory below instead of the per-user directory.
; The same effect on a single run: F4_GENERAL_USE_SYSTEM_PROFILES=0.
;UseSystemProfiles=0

; Where the portable profile lives. Only used when UseSystemProfiles=0.
; %F4HOME% (or $F4HOME) is the directory the f4 binary was started from;
; any other environment variable may be used the same way. A relative
; path is relative to the binary too. Default: %F4HOME%\Profile
;Profile=%F4HOME%\Profile

; Layout of the profile directory, created on first start:
;
;     Profile\
;       settings.ini            main configuration
;       hotkeys.ini             key bindings
;       keymap.ini              key remapping (see docs/KEYMAP.md)
;       highlight.ini           file highlighting
;       farcolors.ini           colour overrides
;       history.json            command / folder / editor history
;       session.ini             panels and window state
;       Macros\scripts\         Lua macros (Far-compatible)
;       plugring\               plugins
;       settings\               user menu, associations, bookmarks
;       styles\                 colour styles
;       lang\, help\            user translations and help
;       crashes\                crash logs
