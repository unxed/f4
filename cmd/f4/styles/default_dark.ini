[style]
Name = Default Dark

# Тема far2l "default dark", перенесённая в f4.
# Источник: farcolors.ini + palette.ini (Tango).
#
# Перенесены только те сущности, которые f4 действительно красит. Ключи far2l,
# у которых в f4 нет слота (Clock, Panel.DragText, Panel.ScreensNumber,
# Dialog.List.*, Dialog.Combo.*, *.Disabled, Menu.GrayText, Menu.Arrows,
# Editor.Text.Selected, Keybar.Background и прочие),
# сюда не попали. Ключи, которых нет в far2l, снабжены пояснением.

[farcolors]

# Panel
Panel.Box = foreground:#555753 | background:#2e3436
Panel.Cursor = foreground:#2e3436 | background:#06989a
# В far2l курсор пассивной панели не выделяется отдельно. Берём LIGHTGRAY на DARKGRAY.
Panel.Cursor.Inactive = foreground:#d3d7cf | background:#555753
# То же для отмеченного файла: YELLOW на DARKGRAY.
Panel.Cursor.Inactive.Selected = foreground:#fce94f | background:#555753
Panel.Cursor.Selected = foreground:#fce94f | background:#06989a
# Сущность f4, слот пока никем не рисуется. Держим равным Panel.Text,
# чтобы включение не перебило раскраску из highlight.ini.
Panel.Dir = foreground:#34e2e2 | background:#2e3436
# Быстрый поиск без совпадений, сущность f4. LIGHTRED на фоне панели.
Panel.FastFindNoMatch = foreground:#ef2929 | background:#2e3436
Panel.Info.Selected = foreground:#fce94f | background:#06989a
Panel.Info.Total = foreground:#eeeeec | background:#2e3436
Panel.Scrollbar = foreground:#34e2e2 | background:#2e3436
# Тонкий скроллбар панели, сущность f4. WHITE на фоне панели.
Panel.Scrollbar.Minimal = foreground:#eeeeec | background:#2e3436
Panel.Text = foreground:#34e2e2 | background:#2e3436
Panel.Text.Highlight = foreground:#d3d7cf | background:#3465a4
Panel.Text.Info = foreground:#fce94f | background:#2e3436
Panel.Text.Selected = foreground:#fce94f | background:#3f474a
Panel.Tabs = foreground:#8f9696 | background:#252a2b
Panel.Tabs.Active = foreground:#eeeeec | background:#2e3436
Panel.Tabs.Accent = foreground:#fce94f
Panel.Tabs.Attention = foreground:#ef2929
Panel.Title = foreground:#d3d7cf | background:#2e3436
Panel.Title.Column = foreground:#8ae234 | background:#2e3436
Panel.Title.Selected = foreground:#d3d7cf | background:#555753

# Lists and tables
# Общий слот для скроллбаров списков и меню. В far2l это два отдельных ключа
# (Dialog.List.Scrollbar, Menu.Scrollbar); берём первый, так как эти
# скроллбары лежат на светло-сером фоне. У справки, панелей, вьюера и
# редактора теперь свои ключи.
Scrollbar = foreground:#2e3436 | background:#d3d7cf
# Разделители колонок таблиц вне панелей и диалогов. Взято из Dialog.Box.
Table.Separator = foreground:#555753 | background:#d3d7cf

# Dialog
Dialog.Box = foreground:#555753 | background:#d3d7cf
Dialog.Box.Title = foreground:#2e3436 | background:#d3d7cf
Dialog.Box.Title.Highlight = foreground:#cc0000 | background:#d3d7cf
Dialog.Button = foreground:#2e3436 | background:#d3d7cf
Dialog.Button.Highlight = foreground:#cc0000 | background:#d3d7cf
Dialog.Button.Highlight.Selected = foreground:#eeeeec | background:#4e9a06
Dialog.Button.Selected = foreground:#2e3436 | background:#4e9a06
Dialog.Combo.Box = foreground:#eeeeec | background:#06989a
Dialog.Combo.Highlight = foreground:#fce94f | background:#06989a
Dialog.Combo.Highlight.Selected = foreground:#fce94f | background:#2e3436
Dialog.Combo.Scrollbar = foreground:#eeeeec | background:#06989a
Dialog.Combo.Text = foreground:#eeeeec | background:#06989a
Dialog.Combo.Text.Selected = foreground:#eeeeec | background:#2e3436
Dialog.Combo.Title = foreground:#eeeeec | background:#06989a
Dialog.Edit = foreground:#eeeeec | background:#555753
Dialog.Edit.Selected = foreground:#fce94f | background:#4e9a06
Dialog.Edit.Unchanged = foreground:#fce94f | background:#4e9a06
Dialog.Text = foreground:#2e3436 | background:#d3d7cf
Dialog.Text.Highlight = foreground:#cc0000 | background:#d3d7cf

# Warning message
WarnDialog.Box = foreground:#d3d7cf | background:#cc0000
WarnDialog.Box.Title = foreground:#eeeeec | background:#cc0000
WarnDialog.Box.Title.Highlight = foreground:#fce94f | background:#cc0000
WarnDialog.Button = foreground:#eeeeec | background:#cc0000
WarnDialog.Button.Highlight = foreground:#fce94f | background:#cc0000
WarnDialog.Button.Highlight.Selected = foreground:#cc0000 | background:#d3d7cf
WarnDialog.Button.Selected = foreground:#2e3436 | background:#d3d7cf
WarnDialog.Edit = foreground:#2e3436 | background:#06989a
WarnDialog.Edit.Selected = foreground:#eeeeec | background:#555753
WarnDialog.Edit.Unchanged = foreground:#d3d7cf | background:#06989a
WarnDialog.Text = foreground:#eeeeec | background:#cc0000
WarnDialog.Text.Highlight = foreground:#fce94f | background:#cc0000

# Menu
Menu.Box = foreground:#555753 | background:#d3d7cf
Menu.Highlight = foreground:#cc0000 | background:#d3d7cf
Menu.Highlight.Selected = foreground:#cc0000 | background:#4e9a06
Menu.Text = foreground:#2e3436 | background:#d3d7cf
Menu.Text.Selected = foreground:#2e3436 | background:#4e9a06
Menu.Title = foreground:#2e3436 | background:#d3d7cf

# Horizontal menu
HMenu.Highlight = foreground:#cc0000 | background:#d3d7cf
HMenu.Highlight.Selected = foreground:#cc0000 | background:#4e9a06
HMenu.Text = foreground:#2e3436 | background:#d3d7cf
HMenu.Text.Selected = foreground:#2e3436 | background:#4e9a06

# Key bar
Keybar.Num = foreground:#d3d7cf | background:#2e3436
Keybar.Text = foreground:#2e3436 | background:#06989a

# Command line
CommandLine = foreground:#d3d7cf | background:#2e3436
CommandLine.Prefix = foreground:#d3d7cf | background:#2e3436
# Приглашение при неактивной панели, сущность f4. DARKGRAY на BLACK.
CommandLine.Prompt.Inactive = foreground:#555753 | background:#2e3436
CommandLine.Selected = foreground:#2e3436 | background:#d3d7cf
CommandLine.UserScreen = foreground:#d3d7cf | background:#2e3436

# Viewer
Viewer.Arrows = foreground:#fce94f | background:#3465a4
Viewer.Scrollbar = foreground:#34e2e2 | background:#3465a4
Viewer.Status = foreground:#2e3436 | background:#06989a
Viewer.Text = foreground:#eeeeec | background:#555753
Viewer.Text.Selected = foreground:#2e3436 | background:#fce94f

# Editor
Editor.Scrollbar = foreground:#34e2e2 | background:#3465a4
Editor.Status = foreground:#2e3436 | background:#06989a
Editor.Text = foreground:#34e2e2 | background:#3465a4

# Help
Help.Box = foreground:#2e3436 | background:#06989a
Help.Box.Title = foreground:#2e3436 | background:#06989a
# Скроллбар справки: фон окна справки, а не светло-серый общий.
Help.Scrollbar = foreground:#2e3436 | background:#06989a
Help.Text = foreground:#2e3436 | background:#06989a
Help.Text.Highlight = foreground:#eeeeec | background:#06989a
Help.Topic = foreground:#fce94f | background:#06989a
Help.Topic.Selected = foreground:#eeeeec | background:#555753
[Highlight_0]
Name = Symbolic Links
IncludeAttributes = Symlink
NormalColor = foreground:#34E2E2

[Highlight_1]
Name = Hidden Files
IncludeAttributes = Hidden
NormalColor = foreground:#06989A

[Highlight_2]
Name = System Files
IncludeAttributes = System
NormalColor = foreground:#06989A

[Highlight_3]
Name = Directories
IncludeAttributes = Directory
NormalColor = foreground:#EEEEEC

[Highlight_4]
Name = Scripts
Mask = *.sh, *.bash, *.py, *.pl, *.cmd, *.exe, *.bat, *.com
ExcludeAttributes = Directory
Mark = *
NormalColor = foreground:#8AE234

[Highlight_5]
Name = Archives
Mask = *.zip, *.rar, *.tar, *.gz, *.7z, *.tgz, *.bz2, *.xz, *.zst, *.jar, *.cab, *.lzh, *.cpio, *.rpm
ExcludeAttributes = Directory
NormalColor = foreground:#AD7FA8

[Highlight_6]
Name = Temporary Files
Mask = *.bak, *.tmp
ExcludeAttributes = Directory
NormalColor = foreground:#C4A000

[Highlight_7]
Name = Executables
IncludeAttributes = Executable
ExcludeAttributes = Directory
Mark = *
NormalColor = foreground:#8AE234
